###############################################
# xArm5 Servo Configuration
###############################################
use_gazebo: false
command_in_type: speed_units
scale:
  linear: 0.4
  rotational: 0.8
  joint: 0.5
butterworth_filter_coeff: 1.5

# Incoming and outgoing topics
cartesian_command_in_topic: /xarm_servo_node/delta_twist_cmds
joint_command_in_topic: /xarm_servo_node/delta_joint_cmds
command_out_topic: /xarm_controller/joint_trajectory
command_out_type: trajectory_msgs/JointTrajectory
joint_topic: /joint_states
status_topic: /xarm_servo_node/status

# Frame settings
robot_link_command_frame: xarm5_link5
planning_frame: sd1_base_link
ee_frame_name: xarm5_link5
move_group_name: xarm_arm
is_primary_planning_scene_monitor: false

# Command output behavior
publish_period: 0.02
low_latency_mode: false
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
incoming_command_timeout: 0.2
num_outgoing_halt_msgs_to_publish: 4
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true

# Singularity and limit handling
lower_singularity_threshold: 30.0
hard_stop_singularity_threshold: 60.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margin: 0.1

# Collision checking
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.002
scene_collision_proximity_threshold: 0.005
